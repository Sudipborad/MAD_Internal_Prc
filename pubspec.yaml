name: tradehub_marketplace
description: A Peer-to-Peer Marketplace Flutter App for buying and selling second-hand goods.

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.0.0
  get: ^4.6.0

  # Local Storage
  hive: ^2.2.0
  hive_flutter: ^1.1.0
  shared_preferences: ^2.0.0

  # Networking
  http: ^1.1.0
  dio: ^5.0.0

  # Image Handling
  image_picker: ^1.0.0
  cached_network_image: ^3.3.0

  # UI & Design
  google_fonts: ^6.0.0
  flutter_animate: ^4.2.0
  lottie: ^3.1.0

  # Datetime
  intl: ^0.19.0

  # Validation
  validators: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  hive_generator: ^2.0.0
  build_runner: ^2.4.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/

  # Fonts will use Google Fonts from package
  # Custom fonts commented out - use google_fonts package instead
